# docker compose up --build  ->  qdrant starts, ingest loads the chunks and exits, then the api starts on :8000
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"          # dashboard: http://localhost:6333/dashboard
    # no volume: ingest rebuilds the collection from data/ on every start, the CSV is the source of truth

  ingest:
    build: .
    image: cloudnation-rag
    command: python -m app.ingest
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

  api:
    image: cloudnation-rag   # the image ingest builds: one build, not two copies of PyTorch and the models
    pull_policy: never
    environment:
      QDRANT_URL: http://qdrant:6333
      # from the shell (e.g. a Codespaces secret) or from .env next to this file; never written in the code
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env or as a Codespaces secret}
    ports:
      - "8000:8000"          # http://localhost:8000
    depends_on:
      ingest:
        condition: service_completed_successfully
