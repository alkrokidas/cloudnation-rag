<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belastingdienst RAG prototype</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; background: #fff; }
    h1 { font-size: 1.3rem; }
    label { display: block; margin: 1rem 0 .3rem; font-weight: 600; }
    textarea, select, button { font: inherit; }
    textarea { width: 100%; box-sizing: border-box; min-height: 5rem; padding: .5rem; }
    button { margin-top: .8rem; padding: .5rem 1.2rem; cursor: pointer; }
    #status { color: #8a5a00; margin-top: 1rem; }
    #answer { white-space: pre-wrap; margin-top: 1rem; padding: 1rem; background: #f4f6f8; border-radius: 6px; }
    #meta { font-size: .85rem; color: #555; margin-top: .8rem; }
    #meta li { margin: .2rem 0; }
  </style>
</head>
<body>
  <h1>Belastingdienst RAG prototype</h1>

  <label for="user">Ingelogd als / Logged in as</label>
  <select id="user">
    <option value="demo-helpdesk">Helpdesk (public)</option>
    <option value="demo-inspector">Inspecteur (public + internal)</option>
    <option value="demo-fiod">FIOD (public + internal + fiod)</option>
  </select>

  <label for="question">Vraag / Question</label>
  <textarea id="question">Mag ik de kosten van mijn werkkamer thuis aftrekken?</textarea>
  <button id="send">Vraag / Ask</button>

  <div id="status"></div>
  <div id="answer" hidden></div>
  <ul id="meta"></ul>

  <script>
    const $ = (id) => document.getElementById(id);

    // POST /ask/stream sends server-sent events: status (System 2), token (a piece of the answer), done, error
    $("send").onclick = async () => {
      const started = performance.now();
      let firstWord = null, finished = false, status = false;
      $("send").disabled = true;
      $("status").textContent = "…";
      $("answer").textContent = "";
      $("answer").hidden = true;
      $("meta").innerHTML = "";

      const handle = (event) => {
        if (event.type === "status") {
          $("status").textContent = `${event.text} (na ${event.ms} ms)`;
          status = true;
        } else if (event.type === "token") {
          if (firstWord === null) {
            firstWord = performance.now() - started;
            if (!status) $("status").textContent = "";       // clear the "…", keep the System 2 message
          }
          $("answer").textContent += event.text;
          $("answer").hidden = false;
        } else if (event.type === "done") {
          finished = true;
          const total = performance.now() - started;
          firstWord ??= total;
          if (!status) $("status").textContent = "";
          $("answer").textContent = event.answer;      // the final text, e.g. the fixed refusal message
          $("answer").hidden = false;
          const lines = [
            `${event.system} · grade ${event.grade} · first word on screen at ${Math.round(firstWord)} ms` +
              ` (server ${event.ttft_ms} ms) · complete at ${Math.round(total)} ms · $${event.cost_usd}`,
            "Trace: " + event.trace.map((t) => `${t.node} ${t.ms} ms`).join(" → "),
            "Sources: " + (event.sources.join(" | ") || "none"),
          ];
          for (const line of lines) {
            const li = document.createElement("li");
            li.textContent = line;
            $("meta").appendChild(li);
          }
        } else if (event.type === "error") {
          finished = true;
          $("status").textContent = event.detail;
        }
      };

      try {
        const response = await fetch("/ask/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + $("user").value },
          body: JSON.stringify({ question: $("question").value }),
        });
        if (!response.ok) {
          const data = await response.json();
          $("status").textContent = "Error " + response.status + ": " + JSON.stringify(data.detail);
          return;
        }
        const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const events = buffer.split("\n\n");     // an event ends with a blank line
          buffer = events.pop();                    // the last part may be an unfinished event
          for (const raw of events) {
            if (raw.startsWith("data: ")) handle(JSON.parse(raw.slice(6)));
          }
        }
        if (!finished) $("status").textContent = "De verbinding is verbroken. / The connection was lost.";
      } catch (error) {
        $("status").textContent = "Error: " + error.message;
      } finally {
        $("send").disabled = false;
      }
    };
  </script>
</body>
</html>
